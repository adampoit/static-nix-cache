name: "static-nix-cache Save"
description: "Export new Nix store paths as a workflow artifact for later deployment with the deploy action"

inputs:
  name:
    description: "Unique name for this artifact (e.g. linux-x86_64). Used as a suffix for the artifact name."
    required: false
    default: "default"
  paths-file:
    description: "Path to a file containing explicit store paths to export. When set, auto-detection is skipped."
    required: false
  paths-dir:
    description: "Directory containing one *.txt paths file per cache artifact to export. Each file is uploaded as static-nix-cache-<name>-<basename>."
    required: false
  signing-key:
    description: "Nix signing key (keyname:base64-ed25519-private). If provided, exported binaries will be signed."
    required: false
  snapshot-path:
    description: "Path to the store snapshot file from the setup action (used for auto-detection)"
    required: false
    default: "/tmp/static-nix-cache-setup/store-paths-before.txt"
  store-dir:
    description: "Path to the Nix store directory (used for auto-detection)"
    required: false
    default: "/nix/store"

runs:
  using: composite
  steps:
    - name: Export store paths
      id: export
      shell: bash
      env:
        ARTIFACT_NAME: ${{ inputs.name }}
        INPUT_PATHS_FILE: ${{ inputs.paths-file }}
        INPUT_PATHS_DIR: ${{ inputs.paths-dir }}
        SNAPSHOT_PATH: ${{ inputs.snapshot-path }}
        STORE_DIR: ${{ inputs.store-dir }}
      run: |
        set -euo pipefail
        EXPORT_ROOT="/tmp/static-nix-cache-save"
        EXPORT_DIR="$EXPORT_ROOT/${ARTIFACT_NAME}"
        mkdir -p "$EXPORT_DIR"

        export_one() {
          local paths_file="$1"
          local export_dir="$2"

          mkdir -p "$export_dir/nix-cache"
          if [ "$paths_file" != "$export_dir/store-paths.txt" ]; then
            cp "$paths_file" "$export_dir/store-paths.txt"
          fi
          sort -u -o "$export_dir/store-paths.txt" "$export_dir/store-paths.txt"

          local count
          count=$(wc -l < "$export_dir/store-paths.txt")
          echo "Exporting $count store path(s) to $export_dir..."

          while IFS= read -r p; do
            [ -z "$p" ] && continue
            echo "  $p"
            nix copy --to "file://$export_dir/nix-cache" "$p" --no-check-sigs
          done < "$export_dir/store-paths.txt"
        }

        if [ -n "$INPUT_PATHS_DIR" ]; then
          shopt -s nullglob
          paths_files=("$INPUT_PATHS_DIR"/*.txt)
          if [ "${#paths_files[@]}" -eq 0 ]; then
            echo "::error::paths-dir contains no *.txt files: $INPUT_PATHS_DIR"
            exit 1
          fi

          for paths_file in "${paths_files[@]}"; do
            artifact_suffix=$(basename "$paths_file" .txt)
            export_one "$paths_file" "$EXPORT_ROOT/${ARTIFACT_NAME}-${artifact_suffix}"
          done

          echo "export-dir=$EXPORT_ROOT" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if [ -n "$INPUT_PATHS_FILE" ]; then
          if [ ! -f "$INPUT_PATHS_FILE" ]; then
            echo "::error::paths-file not found: $INPUT_PATHS_FILE"
            exit 1
          fi

          cp "$INPUT_PATHS_FILE" "$EXPORT_DIR/store-paths.txt"
        elif [ -f "$SNAPSHOT_PATH" ]; then
          # Auto-detect new paths by diffing the store against the setup snapshot
          echo "Auto-detecting new store paths..."
          CURRENT_PATHS=$(mktemp)
          find "$STORE_DIR" -maxdepth 1 -mindepth 1 \
            -not -name '.links' \
            -not -name '*.drv' \
            -not -name '*.chroot' \
            | sort > "$CURRENT_PATHS"
          comm -23 "$CURRENT_PATHS" "$SNAPSHOT_PATH" > "$EXPORT_DIR/store-paths.txt"
          rm -f "$CURRENT_PATHS"
        else
          # Try magic-nix-cache's daemon.pid as a time reference
          MNC_DAEMON_DIR="${MAGIC_NIX_CACHE_DAEMONDIR:-}"
          MNC_PID_FILE="$MNC_DAEMON_DIR/daemon.pid"

          if [ -f "$MNC_PID_FILE" ]; then
            echo "Detecting new store paths since magic-nix-cache started..."
            find "$STORE_DIR" -maxdepth 1 -mindepth 1 \
              -not -name '.links' \
              -not -name '*.drv' \
              -not -name '*.chroot' \
              -cnewer "$MNC_PID_FILE" \
              | sort > "$EXPORT_DIR/store-paths.txt"
          else
            echo "::error::Either paths-file, a store snapshot from the setup action, or MAGIC_NIX_CACHE_DAEMONDIR is required"
            exit 1
          fi
        fi

        export_one "$EXPORT_DIR/store-paths.txt" "$EXPORT_DIR"

        echo "export-dir=$EXPORT_DIR" >> "$GITHUB_OUTPUT"

    - name: Sign exported paths
      if: inputs.signing-key != ''
      shell: bash
      env:
        SIGNING_KEY: ${{ inputs.signing-key }}
        EXPORT_DIR: ${{ steps.export.outputs.export-dir }}
      run: |
        set -euo pipefail
        KEY_FILE=$(mktemp)
        chmod 600 "$KEY_FILE"
        echo "$SIGNING_KEY" > "$KEY_FILE"
        trap 'rm -f "$KEY_FILE"' EXIT

        echo "Signing exported store paths..."
        find "$EXPORT_DIR" -name store-paths.txt -print0 | while IFS= read -r -d '' paths_file; do
          cache_dir=$(dirname "$paths_file")
          while IFS= read -r p; do
            [ -z "$p" ] && continue
            nix store sign --store "file://$cache_dir/nix-cache" --key-file "$KEY_FILE" --recursive "$p"
          done < "$paths_file"
        done
        echo "Signing complete"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: static-nix-cache-${{ inputs.name }}
        path: ${{ steps.export.outputs.export-dir }}
        retention-days: 1
