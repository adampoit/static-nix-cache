name: "static-nix-cache Deploy"
description: "Deploy Nix store paths to an static-nix-cache instance"

inputs:
  paths-file:
    description: "Path to a file containing store paths to deploy. When omitted, paths are auto-detected from the setup snapshot, restored artifacts, or a running magic-nix-cache daemon."
    required: false
  export-dir:
    description: "Path to a nix binary cache export directory. When set, paths are copied from this store instead of the local nix store."
    required: false
  snapshot-path:
    description: "Path to the store snapshot file from the setup action. When the file exists (and paths-file is omitted), new store paths are auto-detected by diffing the nix store."
    required: false
    default: "/tmp/static-nix-cache-setup/store-paths-before.txt"
  store-dir:
    description: "Path to the Nix store directory (used for auto-detection)"
    required: false
    default: "/nix/store"
  artifact-pattern:
    description: "Artifact name pattern for auto-restore (default: static-nix-cache-*). Used when no paths-file or snapshot is available."
    required: false
    default: "static-nix-cache-*"
  backend:
    description: "Storage backend: github-releases, s3, or local"
    required: false
    default: "github-releases"
  github-token:
    description: "GitHub token (required for github-releases backend)"
    required: false
  github-owner:
    description: "GitHub repository owner (defaults to current repository owner)"
    required: false
  github-repo:
    description: "GitHub repository name (defaults to current repository name)"
    required: false
  github-release-tag:
    description: "GitHub release tag for NAR storage"
    required: false
    default: "nix-cache"
  github-release-tags:
    description: "Comma-separated list of GitHub release tags to aggregate into the static site. When set, overrides github-release-tag for static generation."
    required: false
  signing-key:
    description: "Nix signing key (keyname:base64-ed25519-private)"
    required: false
  upload-secret:
    description: "Bearer token for upload authentication"
    required: false
  static:
    description: "Output directory for static site generation (omit to skip)"
    required: false
  port:
    description: "Port for the temporary static-nix-cache server"
    required: false
    default: "18734"
  compression:
    description: "Compression type for nix copy (none, xz, zstd)"
    required: false
    default: "none"

runs:
  using: composite
  steps:
    - name: Try restoring artifacts
      id: try-restore
      if: inputs.paths-file == ''
      continue-on-error: true
      uses: actions/download-artifact@v4
      with:
        pattern: ${{ inputs.artifact-pattern }}
        path: /tmp/static-nix-cache-restore

    - name: Deploy to release(s)
      id: deploy
      shell: bash
      env:
        INPUT_PATHS_FILE: ${{ inputs.paths-file }}
        EXPORT_DIR_INPUT: ${{ inputs.export-dir }}
        SNAPSHOT_PATH: ${{ inputs.snapshot-path }}
        STORE_DIR: ${{ inputs.store-dir }}
        ARTIFACT_PATTERN: ${{ inputs.artifact-pattern }}
        BACKEND: ${{ inputs.backend }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GITHUB_OWNER: ${{ inputs.github-owner }}
        GITHUB_REPO: ${{ inputs.github-repo }}
        GITHUB_RELEASE_TAG: ${{ inputs.github-release-tag }}
        GITHUB_RELEASE_TAGS: ${{ inputs.github-release-tags }}
        SIGNING_KEY: ${{ inputs.signing-key }}
        UPLOAD_SECRET: ${{ inputs.upload-secret }}
        PORT: ${{ inputs.port }}
        COMPRESSION: ${{ inputs.compression }}
        STATIC_NIX_CACHE_DIR: ${{ steps.install.outputs.static-nix-cache-dir }}
      run: |
        set -euo pipefail

        export GITHUB_OWNER="${GITHUB_OWNER:-${{ github.repository_owner }}}"
        export GITHUB_REPO="${GITHUB_REPO:-${{ github.event.repository.name }}}"
        export STORAGE_BACKEND="$BACKEND"

        # ── Helper: resolve store paths ───────────────────────────────────────────
        resolve_paths() {
          local out_file="/tmp/static-nix-cache-deploy-paths.txt"

          if [ -n "$INPUT_PATHS_FILE" ] && [ -f "$INPUT_PATHS_FILE" ]; then
            cp "$INPUT_PATHS_FILE" "$out_file"
          elif [ -n "$SNAPSHOT_PATH" ] && [ -f "$SNAPSHOT_PATH" ]; then
            echo "Auto-detecting new store paths..."
            local current_paths=$(mktemp)
            find "$STORE_DIR" -maxdepth 1 -mindepth 1 \
              -not -name '.links' \
              -not -name '*.drv' \
              -not -name '*.chroot' \
              | sort > "$current_paths"
            comm -23 "$current_paths" "$SNAPSHOT_PATH" > "$out_file"
            rm -f "$current_paths"
          else
            local mnc_addr="127.0.0.1:37515"
            echo "Trying magic-nix-cache at default address $mnc_addr..."
            if local response=$(curl -sf -X POST "http://${mnc_addr}/api/workflow-finish" 2>&1); then
              local mnc_dir="${MAGIC_NIX_CACHE_DAEMONDIR:-}"
              local mnc_pid="$mnc_dir/daemon.pid"
              if [ -f "$mnc_pid" ]; then
                echo "Detecting new store paths since magic-nix-cache started..."
                find "$STORE_DIR" -maxdepth 1 -mindepth 1 \
                  -not -name '.links' \
                  -not -name '*.drv' \
                  -not -name '*.chroot' \
                  -cnewer "$mnc_pid" \
                  | sort > "$out_file"
              else
                echo "::warning::magic-nix-cache is running but MAGIC_NIX_CACHE_DAEMONDIR not set; deploying all current store paths."
                find "$STORE_DIR" -maxdepth 1 -mindepth 1 \
                  -not -name '.links' \
                  -not -name '*.drv' \
                  -not -name '*.chroot' \
                  | sort > "$out_file"
              fi
            else
              echo "::error::Could not detect store paths. Use the setup action, save+deploy pattern, or ensure magic-nix-cache is running."
              exit 1
            fi
          fi

          local count=$(wc -l < "$out_file")
          echo "Will deploy $count store path(s)"
          echo "$out_file"
        }

        # ── Helper: aggregate one artifact dir ────────────────────────────────────
        aggregate_one() {
          local src="$1"
          local dst="$2"
          mkdir -p "$dst/nix-cache"
          : > "$dst/store-paths.txt"

          if [ -f "$src/store-paths.txt" ]; then
            cat "$src/store-paths.txt" >> "$dst/store-paths.txt"
          fi
          if [ -d "$src/nix-cache" ]; then
            cp -rn "$src/nix-cache/." "$dst/nix-cache/" 2>/dev/null || true
          fi
          sort -u -o "$dst/store-paths.txt" "$dst/store-paths.txt"
        }

        # ── Helper: start server for a specific release tag ───────────────────────
        start_server() {
          local tag="$1"
          export GITHUB_RELEASE_TAG="$tag"

          node "$STATIC_NIX_CACHE_DIR/index.js" > /tmp/static-nix-cache-deploy.log 2>&1 &
          local pid=$!

          for i in $(seq 1 30); do
            if curl -sf "http://localhost:${PORT}/nix-cache-info" > /dev/null 2>&1; then
              echo "static-nix-cache server ready on port $PORT (release: $tag)"
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "::error::static-nix-cache server exited unexpectedly"
              cat /tmp/static-nix-cache-deploy.log
              exit 1
            fi
            sleep 1
          done

          echo "$pid"
        }

        # ── Helper: push paths through running server ─────────────────────────────
        push_paths() {
          local paths_file="$1"
          local export_dir="${2:-}"

          while IFS= read -r p; do
            [ -z "$p" ] && continue
            echo "Pushing: $p"
            if [ -n "$export_dir" ] && [ -d "$export_dir" ]; then
              nix copy --from "file://$export_dir" --to "http://localhost:${PORT}?compression=${COMPRESSION}" --no-check-sigs "$p"
            else
              nix copy --to "http://localhost:${PORT}?compression=${COMPRESSION}" --no-check-sigs "$p"
            fi
          done < "$paths_file"
        }

        # ── Determine mode ────────────────────────────────────────────────────────
        if [ -n "$GITHUB_RELEASE_TAGS" ] && [ -z "$INPUT_PATHS_FILE" ] && [ -d /tmp/static-nix-cache-restore ]; then
          # Multi-release mode: one release per matching artifact
          IFS=',' read -ra TAGS <<< "$GITHUB_RELEASE_TAGS"

          for tag in "${TAGS[@]}"; do
            tag=$(echo "$tag" | xargs)  # trim
            suffix="${tag##*-}"
            artifact_dir="/tmp/static-nix-cache-restore/static-nix-cache-${suffix}"

            if [ ! -d "$artifact_dir" ]; then
              echo "Warning: No artifact found for release tag '$tag' (looked in $artifact_dir)"
              continue
            fi

            echo ""
            echo "=== Deploying to release: $tag ==="

            agg_dir="/tmp/static-nix-cache-aggregate-${suffix}"
            aggregate_one "$artifact_dir" "$agg_dir"

            paths_file=$(resolve_paths)
            server_pid=$(start_server "$tag")
            push_paths "$paths_file" "$agg_dir/nix-cache"
            kill "$server_pid" 2>/dev/null || true
          done
        else
          # Single-release mode
          tag="$GITHUB_RELEASE_TAG"

          if [ -z "$INPUT_PATHS_FILE" ] && [ -d /tmp/static-nix-cache-restore ]; then
            agg_dir="/tmp/static-nix-cache-aggregate"
            aggregate_one "/tmp/static-nix-cache-restore" "$agg_dir"
            export_dir="$agg_dir/nix-cache"
          else
            export_dir="$EXPORT_DIR_INPUT"
          fi

          echo ""
          echo "=== Deploying to release: $tag ==="

          paths_file=$(resolve_paths)
          server_pid=$(start_server "$tag")
          push_paths "$paths_file" "$export_dir"
          kill "$server_pid" 2>/dev/null || true
        fi

    - name: Generate static site
      if: inputs.static != ''
      shell: bash
      env:
        STORAGE_BACKEND: ${{ inputs.backend }}
        GITHUB_OWNER: ${{ inputs.github-owner }}
        GITHUB_REPO: ${{ inputs.github-repo }}
        GITHUB_RELEASE_TAG: ${{ inputs.github-release-tag }}
        GITHUB_RELEASE_TAGS: ${{ inputs.github-release-tags }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        OUTPUT_DIR: ${{ inputs.static }}
        STATIC_NIX_CACHE_DIR: ${{ steps.install.outputs.static-nix-cache-dir }}
      run: |
        set -euo pipefail
        export GITHUB_OWNER="${GITHUB_OWNER:-${{ github.repository_owner }}}"
        export GITHUB_REPO="${GITHUB_REPO:-${{ github.event.repository.name }}}"
        node "$STATIC_NIX_CACHE_DIR/generate-static.js"
